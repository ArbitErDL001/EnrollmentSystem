{% extends 'base.html' %}

{% block content %}
<section class="page-header">
    <p class="eyebrow">Students</p>
    <h1>{{ title }}</h1>
    <p>Directory of current academic records.</p>
</section>

<section class="table-card">
    <table>
        <thead>
            <tr>
                <th>Student</th>
                <th>Program</th>
                <th>Year</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.program }}</td>
                <td>{{ student.year }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>
{% endblock %}
