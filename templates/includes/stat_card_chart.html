<div class="stat-card-chart" role="img" aria-label="{{ card.chart_label }}: {{ card.chart_percent }}%">
    <div class="stat-card-donut" style="--chart-value: {{ card.chart_percent }}%" aria-hidden="true">
        <span>{{ card.chart_percent }}%</span>
    </div>
    <small>{{ card.chart_label }}</small>
</div>
