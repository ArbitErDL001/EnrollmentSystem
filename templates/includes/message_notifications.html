<a class="message-notification-link" href="{% url 'message_inbox' %}" aria-label="Messages, {{ unread_message_count }} unread">
    <svg class="message-notification-icon" aria-hidden="true" viewBox="0 0 20 20" fill="none">
        <path d="M3.25 5.25h13.5v9.5H3.25zM3.75 5.75 10 10.5l6.25-4.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Messages</span>
    {% if unread_message_count %}<span class="message-notification-count">{{ unread_message_count }}</span>{% endif %}
</a>
